name: Build Hisba APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Prepare Android project
        run: |
          chmod +x tool/prepare_android.sh
          ./tool/prepare_android.sh

      - name: Build release APK
        run: flutter build apk --release

      - name: Rename APK
        run: cp build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/Hisba.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Hisba-APK
          path: build/app/outputs/flutter-apk/Hisba.apk
          if-no-files-found: error
          retention-days: 30
