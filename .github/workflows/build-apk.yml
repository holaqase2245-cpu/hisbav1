name: Build Hisba APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Extract project
        run: |
          unzip -q hisba_github_ready_v2.zip
          cd hisba_android
          flutter pub get

      - name: Prepare Android project
        working-directory: hisba_android
        run: |
          chmod +x tool/prepare_android.sh
          ./tool/prepare_android.sh

      - name: Build release APK
        working-directory: hisba_android
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Hisba-APK
          path: hisba_android/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30
